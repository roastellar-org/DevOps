apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: arenax-ingress
  namespace: arenax
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: 10m
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - arenax.gg
      secretName: arenax-tls
  rules:
    - host: arenax.gg
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: arenax-backend
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: arenax-frontend
                port:
                  number: 80
