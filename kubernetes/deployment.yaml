apiVersion: apps/v1
kind: Deployment
metadata:
  name: arenax-backend
  namespace: arenax
  labels:
    app: arenax-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: arenax-backend
  template:
    metadata:
      labels:
        app: arenax-backend
    spec:
      containers:
        - name: backend
          image: roastellar/arenax-backend:latest
          ports:
            - containerPort: 3000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: arenax-db-secret
                  key: database-url
          resources:
            requests:
              memory: "128Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "1"
---
apiVersion: v1
kind: Service
metadata:
  name: arenax-backend
  namespace: arenax
spec:
  selector:
    app: arenax-backend
  ports:
    - port: 80
      targetPort: 3000
  type: ClusterIP
