apiVersion: apps/v1
kind: Deployment
metadata:
  name: arenax-backend
  namespace: arenax
  labels:
    app: arenax-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: arenax-backend
  template:
    metadata:
      labels:
        app: arenax-backend
    spec:
      initContainers:
        - name: wait-for-db
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z arenax-postgres 5432; do echo "waiting for postgres"; sleep 2; done
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
      containers:
        - name: backend
          image: ghcr.io/roastellar/arenax-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: arenax-secrets
                  key: database-url
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: arenax-secrets
                  key: jwt-secret
          envFrom:
            - configMapRef:
                name: arenax-config
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
            successThreshold: 1
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: arenax-backend
  namespace: arenax
spec:
  selector:
    app: arenax-backend
  ports:
    - port: 80
      targetPort: http
  type: ClusterIP
