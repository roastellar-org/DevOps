apiVersion: v1
kind: Namespace
metadata:
  name: arenax
  labels:
    name: arenax
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: arenax-quota
  namespace: arenax
spec:
  hard:
    requests.cpu: "8"
    requests.memory: 16Gi
    limits.cpu: "16"
    limits.memory: 32Gi
    pods: "40"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: arenax-limits
  namespace: arenax
spec:
  limits:
    - default:
        cpu: 500m
        memory: 512Mi
      defaultRequest:
        cpu: 250m
        memory: 256Mi
      type: Container
