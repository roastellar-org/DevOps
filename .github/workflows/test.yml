name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            repository: roastellar-org/GameBackend
            test-command: npm test
          - service: frontend
            repository: roastellar-org/Frontend
            test-command: npm test -- --run
    steps:
      - name: Checkout service
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repository }}
          path: ${{ matrix.service }}

      - name: Setup environment
        uses: ./.github/actions/setup-env
        with:
          working-directory: ${{ matrix.service }}

      - name: Lint
        working-directory: ${{ matrix.service }}
        run: npm run lint

      - name: Unit tests
        working-directory: ${{ matrix.service }}
        run: ${{ matrix.test-command }}

      - name: Build
        working-directory: ${{ matrix.service }}
        run: npm run build
